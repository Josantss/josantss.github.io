<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Master - Jogue de Verdade!</title>
<style>
  body { font-family: Arial; text-align: center; background: #1a1a2e; color: white; margin: 0; padding: 20px; }
  .card { background: #16213e; padding: 20px; border-radius: 20px; max-width: 400px; margin: 0 auto; }
  h1 { color: #ffd700; }
  #pontos { font-size: 48px; font-weight: bold; color: #00ff88; }
  #nivel { font-size: 20px; color: #ffd700; }
  #barra { background: #333; height: 20px; border-radius: 10px; overflow: hidden; margin: 10px 0; }
  #progresso { background: linear-gradient(90deg, #00ff88, #ffd700); height: 100%; width: 0%; transition: 0.3s; }
  #btnClick { width: 180px; height: 180px; border-radius: 50%; border: none; background: radial-gradient(circle, #ffd700, #ff6b00); font-size: 60px; cursor: pointer; margin: 20px 0; box-shadow: 0 10px 0 #a34a00; }
  #btnClick:active { transform: scale(0.95); box-shadow: 0 5px 0 #a34a00; }
  .upgrade { background: #0f3460; border: 2px solid #00ff88; color: white; padding: 12px; border-radius: 12px; width: 100%; margin: 5px 0; cursor: pointer; font-size: 16px; }
  .upgrade:disabled { opacity: 0.5; }
  .ranking { background: #0f3460; padding: 10px; border-radius: 12px; margin-top: 15px; }
</style>
</head>
<body>
<div class="card">
  <h1>🏆 CLICK MASTER</h1>
  <div id="nivel">Nível 1 - Iniciante</div>
  <div id="pontos">0</div>
  <div>PONTOS</div>
  <div id="barra"><div id="progresso"></div></div>
  <div id="falta">Faltam 100 pontos pro próximo nível</div>

  <button id="btnClick" onclick="clicar()">👆</button>
  <div id="porClique">+1 por clique</div>

  <button class="upgrade" id="up1" onclick="comprar(1)">⚡ Clique Duplo - 50 pontos<br><small>Ganha +1 por clique</small></button>
  <button class="upgrade" id="up2" onclick="comprar(2)">🔥 Super Clique - 200 pontos<br><small>Ganha +5 por clique</small></button>
  <button class="upgrade" id="up3" onclick="comprar(3)">💎 Clique Diamante - 1000 pontos<br><small>Ganha +20 por clique</small></button>

  <div class="ranking">
    <b>🏅 SEU RECORDE</b><br>
    <span id="recorde">Maior nível: 1</span><br>
    <span id="totalCliques">Total de cliques: 0</span>
  </div>
  <p style="font-size:12px; opacity:0.7">Jogue, suba de nível e seja o mestre do clique!</p>
</div>

<script>
let pontos = parseInt(localStorage.getItem('pontos') || 0);
let porClique = parseInt(localStorage.getItem('porClique') || 1);
let cliques = parseInt(localStorage.getItem('cliques') || 0);
let niveis = ["Iniciante","Aprendiz","Pro","Mestre","Lenda","Click Master"];

function nivelAtual(){ return Math.floor(pontos/100)+1; }
function nomeNivel(){ let n=nivelAtual(); if(n>6) return "Click Master 👑"; return niveis[Math.min(n-1,5)]; }

function atualizar(){
  document.getElementById('pontos').innerText = pontos;
  document.getElementById('nivel').innerText = "Nível " + nivelAtual() + " - " + nomeNivel();
  let resto = pontos % 100;
  document.getElementById('progresso').style.width = resto + "%";
  document.getElementById('falta').innerText = "Faltam " + (100 - resto) + " pontos pro próximo nível";
  document.getElementById('porClique').innerText = "+" + porClique + " por clique";
  document.getElementById('totalCliques').innerText = "Total de cliques: " + cliques;
  let maior = parseInt(localStorage.getItem('maiorNivel') || 1);
  if(nivelAtual() > maior){ maior = nivelAtual(); localStorage.setItem('maiorNivel', maior); }
  document.getElementById('recorde').innerText = "Maior nível: " + maior;
  localStorage.setItem('pontos', pontos);
  localStorage.setItem('porClique', porClique);
  localStorage.setItem('cliques', cliques);
}
function clicar(){ pontos += porClique; cliques++; atualizar(); }
function comprar(tipo){
  if(tipo==1 && pontos>=50){ pontos-=50; porClique+=1; }
  if(tipo==2 && pontos>=200){ pontos-=200; porClique+=5; }
  if(tipo==3 && pontos>=1000){ pontos-=1000; porClique+=20; }
  atualizar();
}
atualizar();
</script>
</body>
</html>
