<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória - Funciona!</title>
<style>
  body { font-family: Arial; text-align: center; background: linear-gradient(135deg, #6a11cb, #2575fc); color: white; margin: 0; padding: 12px; min-height: 100vh; }
  .card-box { background: white; color: #333; padding: 16px; border-radius: 20px; max-width: 520px; margin: 0 auto; }
  h1 { color: #6a11cb; margin: 5px; font-size: 24px; }
  #nivelBox { background: linear-gradient(90deg, #ffd700, #ff6b00); color: white; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 19px; margin: 10px 0; }
  #tempoBox { background: #ff1744; color: white; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 22px; margin: 5px 0; }
  #barra { background: #eee; height: 14px; border-radius: 10px; overflow: hidden; margin: 8px 0; }
  #progresso { background: linear-gradient(90deg, #00e676, #ffd700); height: 100%; width: 0%; transition: 0.4s; }
  #info { display: flex; justify-content: space-between; font-weight: bold; margin: 10px 0; font-size: 15px; background: #f0f0ff; padding: 10px; border-radius: 10px; }
  #grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .carta { aspect-ratio: 1; background: #2575fc; color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .carta.virada { background: #fff3cd; border: 2px solid #ffd700; }
  .carta.acertou { background: #00e676; border: 2px solid #00aa55; }
  button.btn { background: #6a11cb; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; margin: 6px 0; width: 100%; font-weight: bold; }
  #msg { font-size: 18px; font-weight: bold; color: #00aa55; min-height: 26px; margin: 8px 0; }
  #ranking { background: #fff9c4; border: 2px solid #ffd700; border-radius: 12px; padding: 12px; margin-top: 12px; text-align: left; }
  #ranking h3 { margin: 0 0 8px; text-align: center; color: #ff6b00; }
  .rank-item { display: flex; justify-content: space-between; padding: 6px; background: white; margin: 3px 0; border-radius: 8px; font-weight: bold; }
</style>
</head>
<body>
<div class="card-box">
  <h1>🧠 JOGO DA MEMÓRIA</h1>
  <div id="nivelBox">🏆 NÍVEL 1 - INICIANTE</div>
  <div id="tempoBox">⏰ Tempo: <span id="tempo">120</span>s</div>
  <div id="barra"><div id="progresso"></div></div>
  <div id="info"><span>⭐ <span id="pontos">0</span></span><span>🎯 <span id="acertos">0</span>/<span id="total">12</span></span><span>👆 <span id="tentativas">0</span></span></div>
  <div id="msg">Toque numa carta! 🍀</div>
  <div id="grade"></div>
  <button class="btn" onclick="novoJogo()">🔄 Jogar de Novo</button>
  <button class="btn" style="background:#d50000" onclick="destravar()">🆘 SE TRAVOU, CLICA AQUI PRA DESTRAVAR</button>
  <div id="ranking">
    <h3>🏅 TOP 5 MELHORES</h3>
    <div id="listaRanking"></div>
  </div>
</div>

<script>
let pontos = parseInt(localStorage.getItem('mem_pontos') || 0);
let nivel = parseInt(localStorage.getItem('mem_nivel') || 1);
if(nivel > 5) nivel = 1;
let todosEmojis = ['🍕','🚀','⚽','🎮','🍩','🐶','🌟','❤️','🍦','🦁','🎸','🚗','🍎','🐱','🎲','🍔','🌈','🐷','🎧','🍓','🦋','🏀','🍿','🎯'];
let cartas = [];
let primeira = null, segunda = null, travado = false, acertos = 0, tentativas = 0, totalPares = 12;
let tempoRestante = 120, timer = null, jogoAcabou = false;

function destravar(){
  localStorage.clear();
  pontos = 0; nivel = 1;
  alert("Destravado! Agora vai funcionar!");
  novoJogo();
}
function nomeNivel(n){
  if(n==1) return "INICIANTE";
  if(n==2) return "APRENDIZ";
  if(n==3) return "PRO";
  if(n==4) return "MESTRE";
  return "LENDA 👑";
}
function paresDoNivel(n){ if(n==1) return 12; if(n==2) return 18; return 24; }
function tempoDoNivel(n){ if(n==1) return 120; if(n==2) return 180; return 240; }
function embaralhar(arr){ return arr.sort(()=>Math.random()-0.5); }

function novoJogo(){
  if(timer) clearInterval(timer);
  totalPares = paresDoNivel(nivel);
  tempoRestante = tempoDoNivel(nivel);
  jogoAcabou = false;
  let emojis = todosEmojis.slice(0,totalPares);
  cartas = embaralhar([...emojis, ...emojis]);
  acertos = 0; tentativas = 0; primeira=null; segunda=null; travado=false;
  document.getElementById('nivelBox').innerText = "🏆 NÍVEL " + nivel + " - " + nomeNivel(nivel);
  document.getElementById('total').innerText = totalPares;
  document.getElementById('acertos').innerText = 0;
  document.getElementById('tentativas').innerText = 0;
  document.getElementById('progresso').style.width = "0%";
  document.getElementById('tempo').innerText = tempoRestante;
  document.getElementById('msg').innerText = "Toque numa carta! Você tem " + tempoRestante + "s!";
  if(totalPares==24) document.getElementById('grade').style.gridTemplateColumns = "repeat(6, 1fr)";
  else if(totalPares==18) document.getElementById('grade').style.gridTemplateColumns = "repeat(6, 1fr)";
  else document.getElementById('grade').style.gridTemplateColumns = "repeat(4, 1fr)";
  render();
  mostrarRanking();
  iniciarTempo();
}
function iniciarTempo(){
  timer = setInterval(()=>{
    tempoRestante--;
    let el = document.getElementById('tempo');
    if(el) el.innerText = tempoRestante;
    if(tempoRestante <= 0){
      clearInterval(timer);
      jogoAcabou = true;
      alert("⏰ TEMPO ACABOU! Tenta de novo!");
      novoJogo();
    }
  }, 1000);
}
function render(){
  let grade = document.getElementById('grade');
  grade.innerHTML = "";
  document.getElementById('pontos').innerText = pontos;
  cartas.forEach((emoji)=>{
    let b = document.createElement('button');
    b.type = 'button';
    b.className = 'carta'; b.innerText = '❓'; b.dataset.emoji = emoji;
    b.addEventListener('click', function(){ virar(b); });
    grade.appendChild(b);
  });
}
function virar(btn){
  if(travado || jogoAcabou) return;
  if(btn.classList.contains('virada') || btn.classList.contains('acertou')) return;
  btn.classList.add('virada'); btn.innerText = btn.dataset.emoji;
  if(!primeira){ primeira = btn; return; }
  segunda = btn; travado = true; tentativas++;
  document.getElementById('tentativas').innerText = tentativas;
  if(primeira.dataset.emoji === segunda.dataset.emoji){
    let p = primeira, s = segunda;
    setTimeout(()=>{
      p.classList.add('acertou'); s.classList.add('acertou');
      pontos += 50; acertos++;
      document.getElementById('pontos').innerText = pontos;
      document.getElementById('acertos').innerText = acertos;
      document.getElementById('progresso').style.width = (acertos/totalPares*100) + "%";
      document.getElementById('msg').innerText = "Acertou! +50! 🎉";
      localStorage.setItem('mem_pontos', pontos);
      primeira=null; segunda=null; travado=false;
      if(acertos === totalPares){
        clearInterval(timer); jogoAcabou = true;
        pontos += 500;
        localStorage.setItem('mem_pontos', pontos);
        document.getElementById('pontos').innerText = pontos;
        let nome = prompt("🏆 VOCÊ ZEROU! +500 BÔNUS! Qual seu nome pro ranking?");
        if(nome){
          let ranking = JSON.parse(localStorage.getItem('mem_ranking') || "[]");
          ranking.push({nome: nome, pontos: pontos, nivel: nivel});
          ranking.sort((a,b)=> b.pontos - a.pontos);
          ranking = ranking.slice(0,5);
          localStorage.setItem('mem_ranking', JSON.stringify(ranking));
        }
        nivel++;
        localStorage.setItem('mem_nivel', nivel);
        setTimeout(()=>{ alert("🎉 SUBIU PARA O NÍVEL " + nivel + "!"); novoJogo(); }, 500);
      }
    }, 300);
  } else {
    let p = primeira, s = segunda;
    setTimeout(()=>{
      p.classList.remove('virada'); p.innerText='❓';
      s.classList.remove('virada'); s.innerText='❓';
      primeira=null; segunda=null; travado=false;
      document.getElementById('msg').innerText = "Errou! Tenta de novo! 😅";
    }, 600);
  }
}
function mostrarRanking(){
  let ranking = JSON.parse(localStorage.getItem('mem_ranking') || "[]");
  let div = document.getElementById('listaRanking');
  if(ranking.length==0){ div.innerHTML = "<p style='text-align:center'>Ninguém ainda. Seja o primeiro! 🥇</p>"; return; }
  div.innerHTML = "";
  ranking.forEach((r,i)=>{
    let medalha = i==0?"🥇": i==1?"🥈": i==2?"🥉": (i+1)+"º";
    let el = document.createElement('div');
    el.className = 'rank-item';
    el.innerHTML = "<span>"+medalha+" "+r.nome+" - Nv."+r.nivel+"</span><span>"+r.pontos+" pts</span>";
    div.appendChild(el);
  });
}
novoJogo();
</script>
</body>
</html>
