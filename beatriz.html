<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beatriz Memória 💖</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  body{background:#ffe4f1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
  h1{color:#d63384;font-size:32px;margin:10px 0 5px;text-align:center}
  p{color:#666;margin-bottom:15px}
  .info{display:flex;gap:15px;margin-bottom:15px}
  .info div{background:white;padding:10px 18px;border-radius:20px;font-weight:bold;color:#d63384;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;width:100%}
  .card{aspect-ratio:1;background:#ff6fae;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;color:white;transition:.3s;box-shadow:0 4px 10px rgba(0,0,0,.15);user-select:none;overflow:hidden}
  .card.flipped{background:white;transform:rotateY(180deg)}
  .card.matched{background:#a3e635;cursor:default}
  .card:not(.flipped):not(.matched)::after{content:"💖"}
  .card img{width:100%;height:100%;object-fit:cover;border-radius:15px}
  button{margin-top:20px;background:#d63384;color:white;border:none;padding:12px 30px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer}
  #win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center;padding:20px;z-index:10}
  #win h2{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
  <h1>💖 Beatriz Memória 💖</h1>
  <p>Ache todos os pares!</p>
  <div class="info">
    <div>🎯 Tentativas: <span id="moves">0</span></div>
    <div>✅ Acertos: <span id="pairs">0</span>/8</div>
  </div>
  <div class="board" id="board"></div>
  <button onclick="startGame()">🔄 Jogar de Novo</button>
  <div id="win">
    <h2>🎉 Parabéns, Beatriz! 🎉</h2>
    <p style="color:white;font-size:20px">Você achou todos os pares!</p>
    <p style="color:white" id="finalScore"></p>
    <button onclick="closeWin();startGame()">Jogar de Novo 💖</button>
  </div>
<script>
  const items = ['🌸','⭐','🦋','🍓','🌈','🐱','🍩','FOTO'];
  let first=null, lock=false, moves=0, matched=0;
  function startGame(){
    moves=0; matched=0; first=null; lock=false;
    document.getElementById('moves').textContent=0;
    document.getElementById('pairs').textContent=0;
    document.getElementById('win').style.display='none';
    let cards=[...items,...items].sort(()=>Math.random()-0.5);
    let board=document.getElementById('board');
    board.innerHTML='';
    cards.forEach(val=>{
      let div=document.createElement('div');
      div.className='card'; div.dataset.val=val;
      div.onclick=()=>flip(div);
      board.appendChild(div);
    });
  }
  function flip(card){
    if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    if(card.dataset.val==='FOTO'){ card.innerHTML='<img src="beatriz.jpg">'; }
    else { card.textContent=card.dataset.val; }
    if(!first){ first=card; return; }
    moves++; document.getElementById('moves').textContent=moves;
    if(first.dataset.val===card.dataset.val){
      first.classList.add('matched'); card.classList.add('matched');
      matched++; document.getElementById('pairs').textContent=matched;
      first=null;
      if(matched===8){
        setTimeout(()=>{
          document.getElementById('finalScore').textContent='Você conseguiu em '+moves+' tentativas!';
          document.getElementById('win').style.display='flex';
        },500);
      }
    } else {
      lock=true;
      let temp=first; first=null;
      setTimeout(()=>{ temp.classList.remove('flipped'); temp.innerHTML=''; temp.textContent=''; card.classList.remove('flipped'); card.innerHTML=''; card.textContent=''; lock=false; },800);
    }
  }
  function closeWin(){ document.getElementById('win').style.display='none'; }
  startGame();
</script>
</body>
</html>
