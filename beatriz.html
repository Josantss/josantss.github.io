  <div id="win">
    <h2>🎉 Parabéns, Beatriz! 🎉</h2>
    <p style="color:white;font-size:20px">Você achou todos os pares!</p>
    <p style="color:white" id="finalScore"></p>
    <button onclick="closeWin();startGame()">Jogar de Novo 💖</button>
  </div>

<script>
  const emojis = ['🌸','⭐','🦋','🍓','🌈','🐱','🍩','💎'];
  let first=null, lock=false, moves=0, matched=0;
  function startGame(){
    moves=0; matched=0; first=null; lock=false;
    document.getElementById('moves').textContent=0;
    document.getElementById('pairs').textContent=0;
    document.getElementById('win').style.display='none';
    let cards=[...emojis,...emojis].sort(()=>Math.random()-0.5);
    let board=document.getElementById('board');
    board.innerHTML='';
    cards.forEach(emoji=>{
      let div=document.createElement('div');
      div.className='card'; div.dataset.emoji=emoji;
      div.onclick=()=>flip(div);
      board.appendChild(div);
    });
  }
  function flip(card){
    if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped'); card.textContent=card.dataset.emoji;
    if(!first){ first=card; return; }
    moves++; document.getElementById('moves').textContent=moves;
    if(first.dataset.emoji===card.dataset.emoji){
      first.classList.add('matched'); card.classList.add('matched');
      matched++; document.getElementById('pairs').textContent=matched;
      first=null;
      if(matched===8){
        setTimeout(()=>{
          document.getElementById('finalScore').textContent='Você conseguiu em '+moves+' tentativas!';
          document.getElementById('win').style.display='flex';
        },500);
      }
    } else {
      lock=true;
      let temp=first; first=null;
      setTimeout(()=>{ temp.classList.remove('flipped'); temp.textContent=''; card.classList.remove('flipped'); card.textContent=''; lock=false; },800);
    }
  }
  function closeWin(){ document.getElementById('win').style.display='none'; }
  startGame();
</script>
</body>
</html>
